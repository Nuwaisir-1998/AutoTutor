[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotutor"
version = "0.1.0"
description = "An AI tutor that teaches ML concepts to research-grade mastery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autotutor = "autotutor.cli:main"

[tool.setuptools.packages.find]
include = ["autotutor*"]

[tool.setuptools.package-data]
autotutor = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
